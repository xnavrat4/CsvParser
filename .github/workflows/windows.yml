name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

defaults:
  run:
    shell: cmd

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   6.5.2
  ARTIFACT:     csv-parser.zip

jobs:
  build:
    runs-on:  windows-2019
    permissions: write-all
    steps:
      - name: (1) Checkout repo
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: (2) Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f

      - name: Try to cache the Qt-Installation
        id: cache-qt
        uses: actions/cache@v3
        env: 
          cache-name: cache-qt
        with:
          path: ${{ runner.temp }}\Qt
          key: ${{ runner.os }}-Qt-${{ env.QT_VERSION }}
          
      - if: ${{ steps.cache-qt.outputs.cache-hit != 'true' }}
        name: (3) Install Qt
        uses: jurplel/install-qt-action@v4.3.0
        with:
          dir:          ${{ runner.temp }}
          version:      ${{ env.QT_VERSION }}
          host:         windows
          arch:         win64_msvc2019_64
          modules:      all
          setup-python: false
          tools:   tools_ifw tools_qtcreator,qt.tools.qtcreator

      - name: (4) Download JOM
        uses: suisei-cn/actions-download-file@v1
        with:
          url:    http://download.qt.io/official_releases/jom/jom.zip
          target: ${{ runner.temp }}\

      - name: (5) Unzip JOM
        working-directory: ${{ runner.temp }}
        run:  |
              7z x jom.zip -ojom
              
      - name: (6) Create directories
        run: |  
             mkdir ${{ runner.temp }}\build
             mkdir ${{ runner.temp }}\release
             mkdir ${{ runner.temp }}\install

      - name: (7) Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64
          
      - name: (7.5) Clean qmake cache
        run: |
           if exist ${{ runner.temp }}\build (
             rmdir /s /q ${{ runner.temp }}\build
           )
           mkdir ${{ runner.temp }}\build
           
      - name: (8) Build
        working-directory: ${{ runner.temp }}\build
        run: |
          set PATH=%PATH%;..\Qt\${{ env.QT_VERSION }}\msvc2019_64\bin
              cd "%RUNNER_TEMP%\build"
              echo "=== Running qmake ==="
              qmake ${{ env.SOURCE_DIR }}\CsvParser.pro -r -spec win32-msvc ^
                "OBJECTS_DIR=." ^
                "DESTDIR=%RUNNER_TEMP%\release"
              ${{ runner.temp }}\jom\jom -j2

              echo "=== Deploying Qt runtime ==="
              cd "${{ runner.temp }}\release"
              windeployqt --qmldir ${{ env.SOURCE_DIR }} CsvParser.exe --release --compiler-runtime

              copy C:\Windows\System32\concrt140.dll .
              copy C:\Windows\System32\vccorlib140.dll .
              copy C:\Windows\System32\msvcp140.dll .
              copy C:\Windows\System32\vcruntime140.dll .
          
      - name: (9) Zip application folder
        working-directory: ${{ runner.temp }}
        run: |
          7z a csv-parser.zip ${{ runner.temp }}\release\* -r

      - name: (10) Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: ${{ runner.temp }}\csv-parser.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: (11) Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}\csv-parser.zip
